<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Outer Copper-Amber Rim & Light Warm Ivory-Amber Background -->
    <linearGradient id="amberRimGrad" x1="16" y1="12" x2="240" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <radialGradient id="ambientAmber" cx="136" cy="136" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Smoked-Glass Terminal Card -->
    <linearGradient id="cardFill" x1="52" y1="52" x2="204" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>

    <!-- Chevron & Telemetry Bar Gradients -->
    <linearGradient id="chevronGrad" x1="74" y1="82" x2="90" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="bar1Grad" x1="94" y1="118" x2="180" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FDE68A"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="76" y1="144" x2="146" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="pulseWaveGrad" x1="76" y1="168" x2="190" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52525B" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Soft Glow & Shadow Filters -->
    <filter id="amberGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#78350F" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- Outer Copper-Amber Metallic Rim -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#amberRimGrad)"/>

  <!-- Inner Light Warm Squircle -->
  <rect x="20" y="20" width="216" height="216" rx="46" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="216" height="216" rx="46" fill="url(#ambientAmber)"/>

  <!-- Inner Smoked-Glass Terminal Card -->
  <g filter="url(#cardShadow)">
    <rect x="52" y="52" width="152" height="152" rx="32" fill="url(#cardFill)" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5"/>
  </g>

  <!-- Row 1: Command Chevron (>) + Dark Smoked Context Bar -->
  <path d="M76 82L90 93L76 104" stroke="url(#chevronGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#amberGlow)"/>
  <rect x="110" y="88" width="68" height="11" rx="5.5" fill="#3F3F46"/>

  <!-- Row 2: Luminous White-to-Amber-Copper Stream Bar -->
  <rect x="92" y="113" width="88" height="11" rx="5.5" fill="url(#bar1Grad)" filter="url(#amberGlow)"/>

  <!-- Row 3: Segmented Warm Gold & White Log Bar -->
  <rect x="76" y="138" width="70" height="11" rx="5.5" fill="#B45309" fill-opacity="0.7"/>
  <rect x="76" y="138" width="52" height="11" rx="5.5" fill="url(#bar2Grad)" filter="url(#amberGlow)"/>

  <!-- Row 4: Smoked Bar Merging into Live Telemetry Pulse Waveform -->
  <rect x="76" y="163" width="58" height="10" rx="5" fill="#3F3F46"/>
  <path d="M78 168H136C140 168 142 166 143 162L148 153L155 172L163 136L171 184L178 168H190" stroke="url(#pulseWaveGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#amberGlow)"/>
  <path d="M140 168L148 153L155 172L163 136L171 184L178 168H190" stroke="#FEF3C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
</svg>
