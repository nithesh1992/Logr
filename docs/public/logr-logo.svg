<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Outer Copper-Amber Rim & Matte Carbon Background -->
    <linearGradient id="amberRimGrad" x1="16" y1="12" x2="240" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#191A1D"/>
      <stop offset="55%" stop-color="#0E1013"/>
      <stop offset="100%" stop-color="#08090B"/>
    </linearGradient>
    <radialGradient id="ambientAmber" cx="136" cy="136" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Chevron & Telemetry Bar Gradients -->
    <linearGradient id="chevronGrad" x1="68" y1="78" x2="88" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="bar1Grad" x1="92" y1="117" x2="188" y2="117" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FDE68A"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="70" y1="145" x2="146" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="pulseWaveGrad" x1="70" y1="168" x2="200" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27221D" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#D97706" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <!-- Soft Glow Filters -->
    <filter id="amberGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Copper-Amber Metallic Rim -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#amberRimGrad)"/>

  <!-- Inner Matte Carbon-Charcoal Squircle -->
  <rect x="20" y="20" width="216" height="216" rx="46" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="216" height="216" rx="46" fill="url(#ambientAmber)"/>
  <rect x="21" y="21" width="214" height="214" rx="45" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Row 1: Command Chevron (>) + Dark Smoked Context Bar -->
  <path d="M70 80L86 92L70 104" stroke="url(#chevronGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#amberGlow)"/>
  <rect x="112" y="86" width="76" height="12" rx="6" fill="#2A241E" stroke="#F59E0B" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Row 2: Luminous White-to-Amber-Copper Stream Bar -->
  <rect x="92" y="111" width="96" height="12" rx="6" fill="url(#bar1Grad)" filter="url(#amberGlow)"/>

  <!-- Row 3: Segmented Warm Gold & White Log Bar -->
  <rect x="70" y="139" width="76" height="12" rx="6" fill="#B45309" fill-opacity="0.65"/>
  <rect x="70" y="139" width="56" height="12" rx="6" fill="url(#bar2Grad)" filter="url(#amberGlow)"/>

  <!-- Row 4: Smoked Bar Merging into Live Telemetry Pulse Waveform -->
  <rect x="70" y="166" width="66" height="11" rx="5.5" fill="#24201C"/>
  <path d="M74 171H142C146 171 148 169 149 165L154 155L161 175L170 137L179 189L186 171H200" stroke="url(#pulseWaveGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#amberGlow)"/>
  <path d="M145 171L154 155L161 175L170 137L179 189L186 171H200" stroke="#FEF3C7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8"/>
</svg>